plugins {
    id("com.github.hierynomus.license") version "0.16.1"
    id("net.researchgate.release") version '3.1.0'
    id 'java-library'
    id('maven-publish')
    id('signing')
    id('checkstyle')
    id('pmd')
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

description = 'Islandora Alpaca application'

dependencies {

    implementation platform("org.apache.camel.springboot:camel-spring-boot-bom:4.10.0")
    testImplementation platform("org.apache.camel.springboot:camel-spring-boot-bom:4.10.0")
    testImplementation platform("org.junit:junit-bom:5.12.2")

    implementation "org.apache.camel.springboot:camel-spring-boot-starter"
    implementation "org.apache.camel.springboot:camel-http-starter"
    implementation "org.apache.camel.springboot:camel-jackson-starter"
    implementation "org.apache.camel.springboot:camel-jsonpath-starter"
    implementation "org.apache.camel.springboot:camel-activemq6-starter"
    implementation "org.apache.activemq:activemq-client:6.1.6"
    implementation "org.apache.activemq:activemq-pool:6.1.6"


    implementation "org.apache.jena:jena-arq:5.4.0"
    implementation "ch.qos.logback:logback-core:1.5.18"
    implementation "org.slf4j:slf4j-api:2.0.17"
    implementation "net.minidev:json-smart:2.5.2"
    implementation "jakarta.annotation:jakarta.annotation-api:2.1.1"
    implementation "jakarta.inject:jakarta.inject-api:2.0.1"
    implementation "org.apache.httpcomponents:httpclient:4.5.14"
    implementation "info.picocli:picocli:4.7.7"
    implementation "com.jayway.jsonpath:json-path:2.9.0"

    runtimeOnly "ch.qos.logback:logback-classic:1.5.18"

    testImplementation 'org.springframework.boot:spring-boot-test:3.5.0'
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.apache.camel:camel-test-spring-junit5:4.10.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.junit.platform:junit-platform-engine"
}

// Enable bootJar
bootJar {
    archiveClassifier = '' // optional; removes '-boot' suffix
    archiveBaseName= 'islandora-alpaca'
    File outputFileDir = project.file( getProjectDir().toString() + '/src/main/resources' )
    File outputFile = new File( outputFileDir, 'alpaca.properties' )

    doFirst {
        outputFileDir.mkdirs()

        Properties properties = new Properties();

        // Add properties, the file is needed by VersionProvider to determine the current version of Alpaca.
        properties.setProperty("groupId", "${project.group}");
        properties.setProperty("artifactId", "${project.name}");
        properties.setProperty("version", "${project.version}");
        FileOutputStream outputStream = new FileOutputStream(outputFile);
        try {
            properties.store(outputStream, "Generated from Gradle")
        }
        finally {
            outputStream.close()
        }
    }

    // Using old spring.factories because we aren't using spring-aot
    into("META-INF") {
        from("src/main/bootResources/META-INF") {
            include "spring.factories"
        }
    }
}

jar {
    enabled = false
}

group = 'ca.islandora.alpaca'

repositories {
    mavenCentral()
    mavenLocal()
}

configurations {
    compileClasspath {
        resolutionStrategy.activateDependencyLocking() // Enable dependency locking for compile classpath
    }
}

gradle.projectsEvaluated {
    tasks.withType(JavaCompile).tap {
        configureEach {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}

release {
    tagTemplate = '${name}-${version}'
    git {
        requireBranch.set("")
    }
    // Don't automatically push up the changes.
    pushReleaseVersionBranch = null
}

test {
    useJUnitPlatform()
    testLogging {
        // set options for log level LIFECYCLE
        events TestLogEvent.FAILED,
                TestLogEvent.PASSED,
                TestLogEvent.SKIPPED
        //TestLogEvent.STANDARD_OUT
        exceptionFormat TestExceptionFormat.FULL
        showExceptions true
        showCauses true
        showStackTraces true

        // set options for log level DEBUG and INFO
        debug {
            events TestLogEvent.STARTED,
                    TestLogEvent.FAILED,
                    TestLogEvent.PASSED,
                    TestLogEvent.SKIPPED,
                    TestLogEvent.STANDARD_ERROR,
                    TestLogEvent.STANDARD_OUT
            exceptionFormat TestExceptionFormat.FULL
        }
        info.events = debug.events
        info.exceptionFormat = debug.exceptionFormat
    }
}

java {
    sourceCompatibility(JavaVersion.VERSION_21)
    targetCompatibility(JavaVersion.VERSION_21)
    withJavadocJar()
    withSourcesJar()
}

checkstyle {
    config = resources.text.fromFile("${project.projectDir}/gradle/checkstyle/checkstyle.xml")
    configProperties = [
            "checkStyleDir": "${project.projectDir}/gradle/checkstyle"
    ]
    toolVersion "10.25.0"
    ignoreFailures false
}

checkstyleMain.dependsOn classes
checkstyleTest.dependsOn testClasses

license {
    include "**/*.java"
    // Ignore copied Sparql processors classes from fcrepo-camel and fcrepo-camel-toolbox
    excludes(["**/triplestore/processors/*.java"])
    header rootProject.file('gradle/license/header.txt')
    mapping {
        java = 'SLASHSTAR_STYLE'
    }
}

pmd {
    toolVersion = '6.21.0'
    // Only run on src/main
    sourceSets = [sourceSets.main]
    ignoreFailures = true
    ruleSets = []
    ruleSetFiles = rootProject.files('gradle/pmd/ruleset.xml')

}

publishing {
    repositories {
        def sonatypeUsername = project.hasProperty('ossrhUsername') ? ossrhUsername : ""
        def sonatypePassword = project.hasProperty('ossrhPassword') ? ossrhPassword : ""
        def releasesRepoUrl = "https://oss.sonatype.org/service/local/staging/deploy/maven2/"
        def snapshotRepoUrl = "https://oss.sonatype.org/content/repositories/snapshots/"
        maven {
            url version.endsWith("SNAPSHOT") ? snapshotRepoUrl : releasesRepoUrl
            credentials(PasswordCredentials) {
                username = sonatypeUsername
                password = sonatypePassword
            }
        }
    }
    publications {
        shadow(MavenPublication) {
            from components.java
            pom {
                inceptionYear = project.inceptionYear
                name = 'Islandora :: Alpaca'
                description = 'Event driven middleware based on Apache Camel that synchronizes a Fedora with Drupal.'
                url = project.projectHomepage

                organization {
                    name = project.vendor
                    url = project.homepage
                }

                scm {
                    connection = 'scm:git:git@github.com:Islandora/Alpaca.git'
                    developerConnection = 'scm:git:git@github.com:Islandora/Alpaca.git'
                    url = 'https://github.com/islandora/Alpaca'
                    tag = 'HEAD'
                }

                mailingLists {
                    mailingList {
                        name = 'islandora-dev'
                        subscribe = 'islandora-dev+subscribe@googlegroups.com'
                        unsubscribe = 'islandora-dev+unsubscribe@googlegroups.com'
                        post = 'islandora-dev@googlegroups.com'
                        archive = 'https://groups.google.com/d/forum/islandora-dev'
                    }
                }

                issueManagement {
                    system = 'GitHub'
                    url = 'https://github.com/Islandora/documentation/issues'
                }

                developers {
                    developer {
                        id = 'dannylamb'
                        name = 'Daniel Lamb'
                        email = 'dlamb @ (domain of organization url)'
                        organization = 'Born Digital'
                        organizationUrl  ='http://born-digital.com'
                        timezone = '-4'
                    }
                    developer {
                        id = 'whikloj'
                        name = 'Jared Whiklo'
                        email = 'jared.whiklo @ (domain of organization url)'
                        organization = ' University of Manitoba'
                        organizationUrl = 'https://umanitoba.ca'
                        timezone = '-5'
                    }
                }

                licenses {
                    license {
                        name = 'MIT'
                        url = 'https://opensource.org/licenses/MIT'
                        distribution = 'https://opensource.org/licenses/MIT'
                        comments = 'Copyright (c) 2015 Islandora Foundation'
                    }
                }
            }
        }
    }
}

afterReleaseBuild.dependsOn publish

signing {
    required { !version.endsWith("SNAPSHOT") && gradle.taskGraph.hasTask("publish") }
    sign publishing.publications.shadow
}

javadoc {
    options.encoding = 'UTF-8'
    options.memberLevel = JavadocMemberLevel.PUBLIC
}

tasks.register('docs', Javadoc) {
    source subprojects.collect { project -> project.sourceSets.main.allJava }
    classpath = files(subprojects.collect { project -> project.sourceSets.main.compileClasspath })
    destinationDir = new File(projectDir, "docs/${version}")
}
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

tasks.register('codeCoverageReport', JacocoReport) {
    executionData fileTree(project.rootDir.absolutePath).include("**/build/jacoco/*.exec")

    subprojects.each {
        sourceSets it.sourceSets.main
    }
    reports {
        xml.required = true
        xml.outputLocation = file("${buildDir}/reports/jacoco/report.xml")
    }
}

codeCoverageReport.dependsOn test

afterReleaseBuild.dependsOn docs
